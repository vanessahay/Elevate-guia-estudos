[project]
name = "travel-expense-analytics-agent"
version = "0.1.0"
description = "ADK 2.0 Travel Expense Analytics Agent with GCS Ingestion and AlloyDB PostgreSQL Connector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.0.0",
    "google-genai>=0.1.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-alloydb-connector[pg8000]>=1.7.0",
    "pg8000>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
